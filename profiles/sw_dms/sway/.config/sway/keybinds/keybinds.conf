# Use pactl to adjust volume in PulseAudio.
bindsym XF86AudioRaiseVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ +5%
bindsym XF86AudioLowerVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ -5%
bindsym XF86AudioMute exec --no-startup-id pactl set-sink-mute @DEFAULT_SINK@ toggle
bindsym XF86AudioMicMute exec --no-startup-id pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Media player controls
bindsym XF86AudioPlay exec playerctl play-pause
bindsym XF86AudioPause exec playerctl play-pause
bindsym XF86AudioNext exec playerctl next
bindsym XF86AudioPrev exec playerctl previous

floating_modifier $mod

# start a terminal
bindsym $mod+Return exec kitty

# browser (brave)
bindsym $mod+z exec --no-startup-id brave-origin
bindsym $mod+Shift+z exec --no-startup-id brave-origin --incognito

# doplhin file manager
bindsym $mod+shift+d exec --no-startup-id dolphin

# kill focused window
bindsym $mod+q kill


# reload the configuration file
bindsym $mod+Shift+c reload
# exit sway (logs you out of your X session)
bindsym $mod+Shift+e exec "swaynag -t warning -m 'You pressed the exit shortcut. Do you want to exit sway? This will end your (X)wayland session.' -B 'Yes' 'swaymsg exit'" 
#i3-msg

#Brightness 
bindsym XF86MonBrightnessUp exec --no-startup-id brightnessctl set +5%
bindsym XF86MonBrightnessDown exec --no-startup-id brightnessctl set 5%-


#change focus
bindsym $mod+j focus left
bindsym $mod+k focus up

# alternatively, you can use the cursor keys:
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# move focused window
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right

# alternatively, you can use the cursor keys:
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right


# enter fullscreen mode for the focused container
bindsym $mod+f fullscreen toggle

# change container layout (stacked, tabbed, toggle split)
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split

# toggle tiling / floating
bindsym $mod+space floating toggle

# change focus between tiling / floating windows
bindsym $mod+Tab focus mode_toggle

# focus the parent container
bindsym $mod+a focus parent


set $ws1 "1"
set $ws2 "2"
set $ws3 "3"
set $ws4 "4"
set $ws5 "5"
set $ws6 "6"
set $ws7 "7"
set $ws8 "8"
set $ws9 "9"
set $ws10 "10"

# switch to workspace
bindsym $mod+1 workspace number $ws1
bindsym $mod+2 workspace number $ws2
bindsym $mod+3 workspace number $ws3
bindsym $mod+4 workspace number $ws4
bindsym $mod+5 workspace number $ws5
bindsym $mod+6 workspace number $ws6
bindsym $mod+7 workspace number $ws7
bindsym $mod+8 workspace number $ws8
bindsym $mod+9 workspace number $ws9
bindsym $mod+0 workspace number $ws10

# move focused container to workspace
bindsym $mod+Shift+1 move container to workspace number $ws1
bindsym $mod+Shift+2 move container to workspace number $ws2
bindsym $mod+Shift+3 move container to workspace number $ws3
bindsym $mod+Shift+4 move container to workspace number $ws4
bindsym $mod+Shift+5 move container to workspace number $ws5
bindsym $mod+Shift+6 move container to workspace number $ws6
bindsym $mod+Shift+7 move container to workspace number $ws7
bindsym $mod+Shift+8 move container to workspace number $ws8
bindsym $mod+Shift+9 move container to workspace number $ws9
bindsym $mod+Shift+0 move container to workspace number $ws1


bindsym $mod+r mode "resize"
mode "resize" {
        # These bindings trigger as soon as you enter the resize mode

        bindsym h resize shrink width 20 px or 20 ppt
        bindsym j resize grow height 20 px or 20 ppt
        bindsym k resize shrink height 20 px or 20 ppt
        bindsym l resize grow width 20 px or 20 ppt

        # same bindings, but for the arrow keys
        bindsym Left resize shrink width 20 px or 20 ppt
        bindsym Down resize grow height 20 px or 20 ppt
        bindsym Up resize shrink height 20 px or 20 ppt
        bindsym Right resize grow width 20 px or 20 ppt

        # back to normal: Enter or Escape or $mod+r
        bindsym Return mode "default"
        bindsym Escape mode "default"
        bindsym $mod+r mode "default"
}

# swipe to workspaces 
bindgesture swipe:right workspace prev
bindgesture swipe:left workspace next

# Scratchpad:
    # Move the currently focused window to the scratchpad
    bindsym $mod+Shift+minus move scratchpad
    bindsym $mod+minus scratchpad show

# Enable Disable touchooad with toggle
bindsym $mod+Shift+t input type:touchpad events toggle enabled disabled

# DMS
set $ipc dms ipc call
# Core binds
bindsym Mod1+Shift+space exec $ipc control-center toggle
bindsym Mod1+space exec $ipc dash toggle overview
bindsym Mod1+comma exec $ipc settings toggle

# Media keys 
#bindsym --locked XF86AudioRaiseVolume exec $ipc audio increment 5
#bindsym --locked XF86AudioLowerVolume exec $ipc audio decrement 5
bindsym --locked XF86AudioMute exec $ipc audio mute

#bindsym --locked XF86MonBrightnessUp exec $ipc brightness-up
#bindsym --locked XF86MonBrightnessDown exec $ipc brightness-down


#tmux 
bindsym Mod1+t exec $ipc mux toggle

#Suspend
bindsym $mod+l exec --no-startup-id systemctl suspend

#Wallpaper
bindsym Mod1+Shift+w exec $ipc dankdash wallpaper
bindsym Mod1+w exec $ipc wallpaperCarousel toggle

## other controls
#bindsym Mod1+b exec $ipc panel-toggle control-center bluetooth
bindsym Mod1+s exec $ipc processlist toggle
bindsym Mod1+n exec $ipc settings toggleWith network
bindsym Mod1+m exec $ipc dash toggle media

# Media toggle
bindsym Mod1+Shift+m exec $ipc mpris playPause
bindsym Mod1+bracketright exec $ipc mpris next
bindsym Mod1+bracketleft  exec $ipc mpris previous

#Screenshots
bindsym Print exec grim -l 0 - | tee "$(xdg-user-dir PICTURES)/Screenshots/$(date +'%s.png')" | wl-copy --type image/png
bindsym $mod+Shift+s exec --no-startup-id grim -l 0 -g "$(slurp)" - | tee "$(xdg-user-dir PICTURES)/Screenshots/$(date +'%s.png')" | wl-copy --type image/png

#Color pcicker 
bindsym $mod+Shift+i exec $ipc color-picker toggle

#Launcher
bindcode $mod+40 exec $ipc launcher toggle

